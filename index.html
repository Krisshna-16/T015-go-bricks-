function extractAndParseJSON(text) {
  // Strip markdown code fences
  let cleaned = text.replace(/```json\s*/gi, '').replace(/```\s*/g, '').trim();
  // Find first { and last }
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if (start === -1 || end === -1) throw new Error('No JSON object found in response');
  cleaned = cleaned.slice(start, end + 1);
  return JSON.parse(cleaned);
}

function gradeClass(grade) {
  const g = (grade || '').toUpperCase();
  if (g === 'S') return 'grade-s';
  if (g === 'A') return 'grade-a';
  if (g === 'B') return 'grade-b';
  if (g === 'C') return 'grade-c';
  return 'grade-d';
}

// ─── SUB-COMPONENTS ──────────────────────────────────────────────────────────

function CheckboxGroup({ label, items, selected, onChange }) {
  const toggle = (item) => {
    if (selected.includes(item)) onChange(selected.filter(i => i !== item));
    else onChange([...selected, item]);
  };
  return (
    <div>
      <p className="section-label mb-2">{label}</p>
      <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
        {items.map(item => (
          <label key={item} className="matrix-checkbox flex items-center gap-2 cursor-pointer group">
            <input type="checkbox" checked={selected.includes(item)} onChange={() => toggle(item)} />
            <span className="text-xs text-gray-300 group-hover:text-[#00FF41] transition-colors leading-tight">{item}</span>
          </label>
        ))}
      </div>
    </div>
  );
}

// ─── GEMINI API HELPER (auto-fallback across models) ─────────────────────────

const GEMINI_MODELS = [
  { name: 'gemini-2.5-flash', systemSupport: true },
  { name: 'gemini-2.0-flash', systemSupport: true },
  { name: 'gemini-1.5-flash', systemSupport: true },
  { name: 'gemini-1.5-pro',   systemSupport: true },
];

async function callGeminiModel(apiKey, model, systemPrompt, userMessage, maxTokens) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model.name}:generateContent?key=${apiKey}`;
  const body = model.systemSupport
    ? {
        systemInstruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role: 'user', parts: [{ text: userMessage }] }],
        generationConfig: { responseMimeType: 'application/json', temperature: 0.7 },
      }
    : {
        contents: [{ role: 'user', parts: [{ text: `${systemPrompt}\n\n---\n\n${userMessage}` }] }],
        generationConfig: { responseMimeType: 'application/json', temperature: 0.7 },
      };

  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    const errData = await resp.json().catch(() => ({}));
    throw new Error(errData?.error?.message || `HTTP ${resp.status}`);
  }
  const data = await resp.json();
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  if (!text) throw new Error('Empty response');
  return text;
}

async function callGemini(apiKey, systemPrompt, userMessage, maxTokens = 2048) {
  let lastError;
  for (const model of GEMINI_MODELS) {
    try {
      const text = await callGeminiModel(apiKey, model, systemPrompt, userMessage, maxTokens);
      console.log(`✓ GO-BRICS: using ${model.name}`);
      return text;
    } catch (err) {
      console.warn(`✗ ${model.name}: ${err.message}`);
      lastError = err;
    }
  }
  throw new Error(`Could not connect. ${lastError?.message || 'Check your API key.'}`);
}

function RecommenderView({ apiKey }) {
  const [name, setName] = useState('');

  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [result, setResult] = useState(null);

  const handleSubmit = useCallback(async (e) => {
    e.preventDefault();
    if (!name.trim()) { setError('Please enter your name.'); return; }
    if (departments.length === 0) { setError('Please select at least one department.'); return; }
    if (skills.length === 0) { setError('Please select at least one skill.'); return; }
    if (!hours) { setError('Please select your available hours.'); return; }
    if (!apiKey.trim()) { setError('No API key found. Open API Configuration above and paste your Gemini key.'); return; }

    setLoading(true); setError(null); setResult(null);

    const userMessage = `Participant Name: ${name}
Departments they can work in: ${departments.join(', ')}
Skills: ${skills.join(', ')}
Hours available this week: ${hours}
Tasks already completed: ${completed.trim() || 'None'}

Please recommend 5 tasks for this participant and provide a stretch goal.`;

    try {
      const rawText = await callGemini(apiKey.trim(), RECOMMENDER_SYSTEM_PROMPT, userMessage, 2048);
      const parsed = extractAndParseJSON(rawText);
      setResult(parsed);
    } catch (err) {
      setError(err.message || 'An unexpected error occurred. Please try again.');
    } finally {
      setLoading(false);
    }
  }, [name, departments, skills, hours, completed, apiKey]);

  return (
    <div className="space-y-6">
      {/* Form */}
      <form onSubmit={handleSubmit} className="glass-card rounded-2xl p-6 space-y-5">
        <div>
          <label className="section-label block mb-2">YOUR NAME</label>

function AuditView({ apiKey }) {
  const [name, setName] = useState('');
  const [taskId, setTaskId] = useState('');
  const [description, setDescription] = useState('');
  const [proofItems, setProofItems] = useState([]);
  const [notes, setNotes] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [result, setResult] = useState(null);

  const toggleProof = (item) => {
    if (proofItems.includes(item)) setProofItems(proofItems.filter(i => i !== item));
    else setProofItems([...proofItems, item]);
  };

  const handleSubmit = useCallback(async (e) => {
    e.preventDefault();
    if (!name.trim()) { setError('Please enter your name.'); return; }
    if (!taskId.trim()) { setError('Please enter a Task ID.'); return; }
    if (!description.trim()) { setError('Please describe what you did.'); return; }
    if (!apiKey.trim()) { setError('No API key found. Open API Configuration above and paste your Gemini key.'); return; }

    setLoading(true); setError(null); setResult(null);

    const userMessage = `Participant Name: ${name}
Task ID submitted: ${taskId.trim().toUpperCase()}
What was done: ${description}
Proof available: ${proofItems.length > 0 ? proofItems.join(', ') : 'None specified'}
Additional notes: ${notes.trim() || 'None'}

Please assess this submission and give a verdict.`;

    try {
      const rawText = await callGemini(apiKey.trim(), AUDIT_SYSTEM_PROMPT, userMessage, 1500);
      const parsed = extractAndParseJSON(rawText);
      setResult(parsed);
    } catch (err) {
      setError(err.message || 'An unexpected error occurred. Please try again.');
    } finally {
      setLoading(false);
    }
  }, [name, taskId, description, proofItems, notes, apiKey]);

  return (
    <div className="space-y-6">
      <form onSubmit={handleSubmit} className="glass-card rounded-2xl p-6 space-y-5">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label className="section-label block mb-2">YOUR NAME</label>
            <input
              type="text"
              value={name}
              onChange={e => setName(e.target.value)}
              placeholder="e.g. James Okafor"
              className="matrix-input w-full rounded-lg px-4 py-2.5 text-sm"
            />
          </div>
          <div>
            <label className="section-label block mb-2">TASK ID</label>
            <input
              type="text"
              value={taskId}
              onChange={e => setTaskId(e.target.value)}
              placeholder="e.g. T03, C07, S06"
              className="matrix-input w-full rounded-lg px-4 py-2.5 text-sm font-mono"
            />
          </div>
        </div>

        <div>
          <label className="section-label block mb-2">WHAT DID YOU DO? (TASK DESCRIPTION)</label>
          <textarea
            value={description}
            onChange={e => setDescription(e.target.value)}
            placeholder="Describe in detail what you completed for this task…"
            rows={4}
            className="matrix-input w-full rounded-lg px-4 py-2.5 text-sm resize-none leading-relaxed"
          />
        </div>

        <div>
          <p className="section-label mb-2">PROOF AVAILABLE — TICK ALL THAT APPLY</p>
          <div className="grid grid-cols-2 gap-1.5">
            {PROOF_OPTIONS.map(item => (
              <label key={item} className="matrix-checkbox flex items-center gap-2 cursor-pointer group">
                <input type="checkbox" checked={proofItems.includes(item)} onChange={() => toggleProof(item)} />
                <span className="text-xs text-gray-300 group-hover:text-[#00FF41] transition-colors">{item}</span>
              </label>
            ))}
          </div>
        </div>

        <div>
          <label className="section-label block mb-2">ANY NOTES OR CONTEXT (OPTIONAL)</label>
          <textarea
            value={notes}
            onChange={e => setNotes(e.target.value)}
            placeholder="Any extra context, explanations, or circumstances you'd like the auditor to know…"
            rows={3}
            className="matrix-input w-full rounded-lg px-4 py-2.5 text-sm resize-none leading-relaxed"
          />
        </div>

        {error && (
          <ErrorState message={error} onDismiss={() => setError(null)} />
        )}

        <button type="submit" disabled={loading} className="matrix-btn w-full py-3.5 rounded-xl text-sm">
          {loading ? '⟳ Processing…' : '🔍 Check My Submission'}
        </button>
      </form>

      {loading && <LoadingState />}

      {result && !loading && (
        <AuditResultCard result={result} />
      )}
    </div>
  );
}

              onClick={() => setTab('recommender')}
              className={`tab-btn flex-1 py-2 px-3 text-center ${tab === 'recommender' ? 'active text-[#00FF41]' : 'text-gray-500 hover:text-gray-300'}`}
            >
              ⚡ TASK RECOMMENDER
            </button>
            <button
              id="tab-audit"
              onClick={() => setTab('audit')}
              className={`tab-btn flex-1 py-2 px-3 text-center ${tab === 'audit' ? 'active text-[#00FF41]' : 'text-gray-500 hover:text-gray-300'}`}
            >
              🔍 GBP AUDIT CHECKER
            </button>
          </div>
        </div>
      </header>

      {/* Main Content */}
      <main className="max-w-3xl mx-auto px-4 py-6">
        {/* Mode description */}
        {tab === 'recommender' ? (
          <div className="mb-5 animate-fade-in">
            <p className="text-gray-400 text-sm leading-relaxed">
              Enter your profile below and our AI will analyse the full GO-BRICS task catalogue to recommend your best 5 tasks — ranked by fit and earning potential.
            </p>
          </div>
        ) : (
          <div className="mb-5 animate-fade-in">
            <p className="text-gray-400 text-sm leading-relaxed">
              Submit your completed task details and our AI auditor will assess whether your submission meets the official proof requirements and give you an instant eligibility verdict.
            </p>
          </div>
        )}

        {/* Settings */}
        <SettingsPanel apiKey={apiKey} setApiKey={setApiKey} show={showSettings} setShow={setShowSettings} />

        {/* Mode Views */}
        {tab === 'recommender'
          ? <RecommenderView key="recommender" apiKey={apiKey} />
          : <AuditView key="audit" apiKey={apiKey} />
        }
      </main>

      {/* Footer */}
      <footer className="border-t border-[#00FF41]/8 mt-12 py-6">
        <div className="max-w-3xl mx-auto px-4">
          <div className="flex flex-col sm:flex-row items-center justify-between gap-2">
            <p className="text-gray-700 text-[10px] font-mono tracking-wider">GO-BRICS BUSINESS LAB · TASK INTELLIGENCE SYSTEM</p>
            <p className="text-gray-700 text-[10px] font-mono">Powered by Gemini 2.5 Flash · Free Tier</p>
          </div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
